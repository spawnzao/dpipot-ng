{{- if .Values.dpipotProxy.enabled }}
---
# DaemonSet: runs dpipot-proxy on every node in the cluster (typically one
# node in a standalone proxy deployment). Uses hostNetwork so that TPROXY
# iptables rules set by the init container redirect traffic into the proxy
# socket running on the host network stack.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpipot-proxy
  namespace: dpipot
  labels:
    app: dpipot-proxy
spec:
  selector:
    matchLabels:
      app: dpipot-proxy
  template:
    metadata:
      labels:
        app: dpipot-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # Allow scheduling on control-plane nodes — necessary in single-node
        # standalone deployments where master taint is present.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: iptables-tproxy
          image: alpine:3.19
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - /bin/sh
            - -c
            - |
              set -e
              IFACE="{{ .Values.network.interface }}"
              PROXY_PORT=8080

              echo "Setting up TPROXY rules on interface ${IFACE}, port ${PROXY_PORT}..."

              # Mark packets that will be redirected so the routing policy
              # can divert them to the loopback (local socket).
              iptables -t mangle -N DPIPOT_DIVERT 2>/dev/null || true
              iptables -t mangle -F DPIPOT_DIVERT
              iptables -t mangle -A DPIPOT_DIVERT -j MARK --set-mark 1
              iptables -t mangle -A DPIPOT_DIVERT -j ACCEPT

              # Redirect all TCP on the data interface through TPROXY.
              iptables -t mangle -D PREROUTING -i "${IFACE}" -p tcp \
                -j TPROXY --tproxy-mark 1/1 --on-port "${PROXY_PORT}" 2>/dev/null || true
              iptables -t mangle -I PREROUTING 1 -i "${IFACE}" -p tcp \
                -j TPROXY --tproxy-mark 1/1 --on-port "${PROXY_PORT}"

              # Policy route: packets with mark 1 go to loopback.
              ip rule del fwmark 1 lookup 100 2>/dev/null || true
              ip rule add fwmark 1 lookup 100
              ip route add local 0.0.0.0/0 dev lo table 100 2>/dev/null || true

              echo "TPROXY rules applied: all TCP on ${IFACE} -> 127.0.0.1:${PROXY_PORT}"
      containers:
        - name: dpipot-proxy
          image: ghcr.io/spawnzao/dpipot:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          args: ["proxy"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - configMapRef:
                name: dpipot-config
          resources:
            requests:
              cpu: {{ .Values.resources.dpipot.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.resources.dpipot.requests.memory | default "128Mi" | quote }}
            limits:
              cpu: {{ .Values.resources.dpipot.limits.cpu | default "1000m" | quote }}
              memory: {{ .Values.resources.dpipot.limits.memory | default "512Mi" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
