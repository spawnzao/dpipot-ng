{{- if .Values.honeypots.wordpot.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpot
  namespace: dpipot
  labels:
    app: wordpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpot
  template:
    metadata:
      labels:
        app: wordpot
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: wordpot
          image: dtagdevsec/wordpot:24.04.1
          ports:
            - containerPort: 80
              protocol: TCP
              hostPort: 80
              hostIP: {{ .Values.hostExpose.ip | quote }}
          volumeMounts:
            - name: wordpot-logs
              mountPath: /opt/wordpot/logs
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: wordpot-logs
          image: busybox:stable
          command:
            - /bin/sh
            - -c
            - |
              until [ -f /logs/wordpot.log ]; do sleep 1; done
              tail -n +1 -F /logs/wordpot.log &
              TAIL_PID=$!
              while true; do
                now=$(date +%s)
                sleep $(( (now / 86400 + 1) * 86400 - now ))
                yday=$(date -u -d @$(( $(date +%s) - 43200 )) +%Y%m%d)
                gzip -c /logs/wordpot.log > /logs/wordpot.${yday}.log.gz && : > /logs/wordpot.log
                find /logs -name 'wordpot.????????.log.gz' -mtime +6 -delete 2>/dev/null
              done &
              wait $TAIL_PID
          volumeMounts:
            - name: wordpot-logs
              mountPath: /logs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: wordpot-logs
          emptyDir: {}
{{- end }}
