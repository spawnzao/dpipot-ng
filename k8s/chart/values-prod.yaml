image:
  dpipot:
    tag: latest

config:
  NDPI_EVENTS_ENABLED: "true"
  SSH_BANNER_POOL: "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.9,SSH-2.0-OpenSSH_8.4p1 Debian-2+deb11u2,SSH-2.0-OpenSSH_7.9p1 Raspbian-10+deb10u2"
  SSH_BANNER_MAP: "22=SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.9,222=SSH-2.0-OpenSSH_7.9p1 Raspbian-10+deb10u2,2222=SSH-2.0-OpenSSH_8.4p1 Raspbian-5+deb11u1"

kafka:
  persistence:
    enabled: true
    size: 100Gi

resources:
  dpipot:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  logstash:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  galah:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # Raised 256Mi→512Mi→1Gi: galah in-memory response cache grows unboundedly
      # at ~44 MiB/h under observed traffic; OOM at 512Mi after ~9h (Sep 6 2026).
      memory: 1Gi
  kafka:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
