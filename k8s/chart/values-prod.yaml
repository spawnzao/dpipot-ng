image:
  dpipot:
    tag: latest

config:
  NDPI_EVENTS_ENABLED: "true"

kafka:
  persistence:
    enabled: true
    size: 100Gi

resources:
  dpipot:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  logstash:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  galah:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # Raised 256Mi→512Mi→1Gi: galah in-memory response cache grows unboundedly
      # at ~44 MiB/h under observed traffic; OOM at 512Mi after ~9h (Sep 6 2026).
      memory: 1Gi
  kafka:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
