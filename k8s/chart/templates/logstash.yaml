{{- if or .Values.kafka.enabled .Values.filebeat.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: dpipot
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false
    pipeline.workers: {{ .Values.logstash.pipelineWorkers }}
    pipeline.batch.size: {{ .Values.logstash.pipelineBatchSize }}

  pipelines.yml: |
{{- if .Values.kafka.enabled }}
    - pipeline.id: kafka-to-elasticsearch
      path.config: "/usr/share/logstash/pipeline/kafka-to-elasticsearch.conf"
{{- end }}
{{- if .Values.filebeat.enabled }}
    - pipeline.id: kubernetes-logs
      path.config: "/usr/share/logstash/pipeline/kubernetes-logs.conf"
{{- end }}

  kafka-to-elasticsearch.conf: |
    input {
      kafka {
        bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
        topics_pattern => "dpipot.events.*"
        group_id => "logstash-consumer"
        auto_offset_reset => "earliest"
        codec => "json"
        decorate_events => "extended"
      }
    }
    filter {
      if [timestamp] {
        date {
          match => ["timestamp", "ISO8601"]
          target => "@timestamp"
          remove_field => ["timestamp"]
        }
      }
      mutate {
        add_field => {
          "[@metadata][doc_id]" => "%{[@metadata][kafka][topic]}|%{[@metadata][kafka][partition]}|%{[@metadata][kafka][offset]}"
        }
        remove_field => ["[event][original]"]
      }
      if [port_mismatch] {
        mutate {
          add_tag => ["port_mismatch"]
        }
      }
      if [ndpi_proto] == "Unknown" or [ndpi_proto] =~ /^Unknown/ {
        mutate {
          add_tag => ["ndpi_unknown"]
        }
      }
      if [honeypot_error] =~ /no route/ {
        mutate {
          add_tag => ["no_route"]
        }
      }
    }
    output {
      if [instance] == "proxy" {
        elasticsearch {
          hosts => ["${ELASTICSEARCH_HOST}"]
          index => "dpipot-proxy-%{+YYYY.MM.dd}"
          action => "index"
          document_id => "%{[@metadata][doc_id]}"
          manage_template => false
          user => "${ELASTICSEARCH_USER}"
          password => "${ELASTIC_PASSWORD}"
          ssl => true
          cacert => "/usr/share/logstash/config/certs/ca.crt"
        }
      } else if [instance] == "classifier" {
        elasticsearch {
          hosts => ["${ELASTICSEARCH_HOST}"]
          index => "dpipot-classifier-%{+YYYY.MM.dd}"
          action => "index"
          document_id => "%{[@metadata][doc_id]}"
          manage_template => false
          user => "${ELASTICSEARCH_USER}"
          password => "${ELASTIC_PASSWORD}"
          ssl => true
          cacert => "/usr/share/logstash/config/certs/ca.crt"
        }
      } else {
        elasticsearch {
          hosts => ["${ELASTICSEARCH_HOST}"]
          index => "dpipot-unknown-%{+YYYY.MM.dd}"
          action => "index"
          document_id => "%{[@metadata][doc_id]}"
          manage_template => false
          user => "${ELASTICSEARCH_USER}"
          password => "${ELASTIC_PASSWORD}"
          ssl => true
          cacert => "/usr/share/logstash/config/certs/ca.crt"
        }
      }
    }

  kubernetes-logs.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter {
      mutate {
        remove_field => ["agent", "ecs", "input", "tags", "@version", "service"]
      }
      if [msg] {
        mutate { remove_field => ["message"] }
      }
      if [ts] {
        date {
          match => ["ts", "ISO8601"]
          target => "@timestamp"
          remove_field => ["ts"]
        }
      }
      if [level] {
        mutate { lowercase => ["level"] }
      }
      if [kubernetes][container][name] == "cowrie-logs" {
        json {
          source => "message"
          target => "cowrie"
          skip_on_invalid_json => true
        }
        if [cowrie][timestamp] {
          date {
            match => ["[cowrie][timestamp]", "ISO8601"]
            target => "@timestamp"
          }
        }
        mutate { remove_field => ["message"] }
      }
      if [kubernetes][container][name] == "wordpot-logs" {
        json {
          source => "message"
          target => "wordpot"
          skip_on_invalid_json => true
        }
        if [wordpot][timestamp] {
          date {
            match => ["[wordpot][timestamp]", "ISO8601"]
            target => "@timestamp"
          }
        }
        mutate { remove_field => ["message"] }
      }
      if [kubernetes][container][name] == "heralding-logs" {
        json {
          source => "message"
          target => "heralding"
          skip_on_invalid_json => true
        }
        if [heralding][timestamp] {
          date {
            match => ["[heralding][timestamp]", "yyyy-MM-dd HH:mm:ss.SSSSSS"]
            target => "@timestamp"
            # Remove nested field: heralding.timestamp format (space-separated,
            # microsecond precision) is rejected by ES strict_date_optional_time.
            remove_field => ["[heralding][timestamp]"]
          }
        }
        # filebeat decode_json_fields (target:"") also promotes all heralding
        # JSON keys to the root event. Remove the top-level timestamp here so
        # ES does not try to re-parse it as a date and reject with status 400.
        mutate { remove_field => ["message", "timestamp"] }
      }
      if [kubernetes][container][name] == "galah-logs" {
        json {
          source => "message"
          target => "galah"
          skip_on_invalid_json => true
        }
        if [galah][timestamp] {
          date {
            match => ["[galah][timestamp]", "ISO8601"]
            target => "@timestamp"
          }
        }
        mutate { remove_field => ["message"] }
      }
    }
    output {
      if [kubernetes][container][name] in ["proxy", "classifier"] {
        elasticsearch {
          hosts           => ["${ELASTICSEARCH_HOST}"]
          index           => "dpipot-app-%{+YYYY.MM.dd}"
          action          => "create"
          manage_template => false
          user            => "${ELASTICSEARCH_USER}"
          password        => "${ELASTIC_PASSWORD}"
          ssl             => true
          cacert          => "/usr/share/logstash/config/certs/ca.crt"
        }
      } else if [kubernetes][container][name] in ["logstash", "filebeat", "promtail", "kafka"] {
        elasticsearch {
          hosts           => ["${ELASTICSEARCH_HOST}"]
          index           => "dpipot-infra-%{+YYYY.MM.dd}"
          action          => "create"
          manage_template => false
          user            => "${ELASTICSEARCH_USER}"
          password        => "${ELASTIC_PASSWORD}"
          ssl             => true
          cacert          => "/usr/share/logstash/config/certs/ca.crt"
        }
      } else {
        elasticsearch {
          hosts           => ["${ELASTICSEARCH_HOST}"]
          index           => "dpipot-pods-%{+YYYY.MM.dd}"
          action          => "create"
          manage_template => false
          user            => "${ELASTICSEARCH_USER}"
          password        => "${ELASTIC_PASSWORD}"
          ssl             => true
          cacert          => "/usr/share/logstash/config/certs/ca.crt"
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: dpipot
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
    - name: http
      port: 9600
      targetPort: 9600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: dpipot
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.12.0
          ports:
            - containerPort: 5044
              protocol: TCP
            - containerPort: 9600
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: {{ .Values.resources.logstash.heapOpts | default "-Xmx1g -Xms1g" | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-svc.dpipot.svc.cluster.local:9092"
            - name: ELASTICSEARCH_HOST
              valueFrom:
                secretKeyRef:
                  name: logstash-elasticsearch-secrets
                  key: ELASTICSEARCH_HOST
            - name: ELASTICSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: logstash-elasticsearch-secrets
                  key: ELASTICSEARCH_USER
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logstash-elasticsearch-secrets
                  key: ELASTIC_PASSWORD
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config
              readOnly: true
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline
            - name: elastic-certs
              mountPath: /usr/share/logstash/config/certs
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.logstash.requests.cpu }}
              memory: {{ .Values.resources.logstash.requests.memory }}
            limits:
              cpu: {{ .Values.resources.logstash.limits.cpu }}
              memory: {{ .Values.resources.logstash.limits.memory }}
          # Detects a known logstash-output-elasticsearch bug where the output
          # thread silently freezes after an ES reconnect ("Restored connection")
          # while the JVM/API remain responsive. A plain httpGet on :9600 misses
          # this because the monitoring API keeps answering even with a frozen
          # pipeline. This probe checks the cumulative events.out counter from
          # /_node/stats/pipelines instead: if it stops advancing for >10 min
          # (600s) the probe fails and Kubernetes restarts the pod.
          # initialDelaySeconds=300: JVM+JRuby cold start observed up to ~3m30s
          # in production; failureThreshold=3 adds +90s tolerance (3×30s).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  STATE=/tmp/logstash_liveness_state
                  NOW=$(date +%s)
                  OUT=$(curl -s --max-time 5 http://localhost:9600/_node/stats/pipelines 2>/dev/null \
                    | grep -o '"events":{"out":[0-9]*' | head -1 | grep -o '[0-9]*$')
                  if [ -z "$OUT" ]; then
                    echo "monitoring API (9600) did not respond"
                    exit 1
                  fi
                  if [ -f "$STATE" ]; then
                    PREV_OUT=$(cut -d' ' -f1 "$STATE")
                    PREV_TIME=$(cut -d' ' -f2 "$STATE")
                  else
                    PREV_OUT=""
                    PREV_TIME=""
                  fi
                  if [ "$OUT" != "$PREV_OUT" ]; then
                    echo "$OUT $NOW" > "$STATE"
                    exit 0
                  fi
                  STUCK_FOR=$((NOW - PREV_TIME))
                  if [ "$STUCK_FOR" -gt 600 ]; then
                    echo "pipeline stuck for ${STUCK_FOR}s (events.out stalled at $OUT)"
                    exit 1
                  fi
                  exit 0
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: logstash-config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
              - key: pipelines.yml
                path: pipelines.yml
        - name: logstash-pipeline
          configMap:
            name: logstash-config
            items:
              - key: kafka-to-elasticsearch.conf
                path: kafka-to-elasticsearch.conf
              - key: kubernetes-logs.conf
                path: kubernetes-logs.conf
        - name: elastic-certs
          secret:
            secretName: elastic-certs
{{- end }}
